<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片处理 · 鱼丸创作工具箱</title><link rel="stylesheet" href="/style.css"><style>body{display:block}main{margin:auto;max-width:1500px}#imageWorkspace{display:grid;grid-template-columns:240px 370px 1fr;gap:20px}.image-file{display:block;text-align:left;width:100%;margin:6px 0;overflow:hidden}.image-file.active{border-color:#176b63;background:#e7f3ee}.effect{padding:14px;margin-bottom:10px}.effect label{margin:7px 0}.effect .pair{display:flex;gap:8px;align-items:center}.effect input[type=range]{width:65%}.effect input[type=number]{width:80px}#preview{max-width:100%;max-height:65vh;object-fit:contain;touch-action:none;user-select:none}#imageStatus{white-space:pre-wrap;margin:15px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:#667}.preview-panel{position:sticky;top:15px;align-self:start}.image-tool-link{padding:12px}#list{max-height:65vh;overflow:auto}#imageWorkspace>*{min-width:0}#imageWorkspace .panel{min-width:0}#list,.small,#results,#dimensions,#imageStatus{overflow-wrap:anywhere}.image-file{white-space:normal;overflow-wrap:anywhere}#imageWorkspace input:not([type=checkbox]),#imageWorkspace select{max-width:100%;box-sizing:border-box;min-width:0}.effect .pair{min-width:0}.effect input[type=range]{min-width:0;flex:1}.effect input[type=number]{flex:0 1 80px}.toolbar button{max-width:100%;white-space:normal}header>*{min-width:0}header{flex-wrap:wrap;gap:12px}@media(max-width:1000px){#imageWorkspace{grid-template-columns:minmax(0,1fr)}.preview-panel{position:static}main{box-sizing:border-box;width:100%;padding:16px}header{align-items:flex-start}#preview{max-width:100%}}</style><body><main><header><div><a href="/">← 返回创作工具箱</a><h1>图片处理</h1><p>本地 JPEG / PNG · 无需 AI 或账号</p></div><button id="export" class="primary">导出全部图片</button></header><p class="hint">兼容模式导出始终不保留源图片信息；启用“图片信息”后增加清理验证。透明度会丢失，方向标签会移除且不自动转正。像素变换不保证任何平台查重结果。</p><div id="imageStatus" role="status" aria-live="polite"></div><div id="imageWorkspace"><section class="panel"><h2>导入图片</h2><label class="drop" id="imageDrop"><strong>选择或拖入图片</strong><input id="files" type="file" multiple accept=".jpg,.jpeg,.png"></label><p class="small">预览单张，导出整个列表。重复的文件名及内容跳过。兼容中间文件只写入隔离副本。</p><button id="clearFiles">清空列表</button><div id="list"></div></section><section><div class="panel"><div class="toolbar"><button id="reset">清空设置</button><button id="random">换一组随机结果</button></div><label>随机 seed<input id="seed" inputmode="numeric" value="0" pattern="[0-9]+"></label><div id="effects"></div><details><summary>高级兼容设置</summary><label class="check"><input id="intermediate" type="checkbox" checked>导出写入隔离副本旁 processed</label><label class="check"><input id="previewDisk" type="checkbox" checked>预览也写入隔离 processed</label><p class="small">固定中间文件会重写；你的原文件保持只读。每次批导出使用独立文件夹。</p><label>同名文件<select id="collision"><option value="overwrite">重写已有结果</option><option value="skip">跳过</option><option value="rename">自动编号</option></select></label></details></div><div class="panel"><h2>预设</h2><select id="preset"><option value="">当前设置</option></select><input id="presetName" placeholder="预设名称"><div class="toolbar"><button id="newPreset">新建</button><button id="savePreset">保存</button><button id="deletePreset">删除</button><button id="backupPresets">备份</button><button id="restorePresets">恢复</button></div><input id="presetFile" type="file" accept=".json" hidden></div></section><section class="panel preview-panel"><h2>实际处理预览</h2><p class="hint">按住图片看原图；释放或切换窗口后恢复。</p><div id="previewEmpty" class="hint" style="padding:48px 16px;text-align:center">导入图片后，在这里查看处理效果。</div><img id="preview" alt="图片处理预览" draggable="false" hidden><p id="dimensions" class="hint"></p><button id="cancel" hidden>取消任务</button><div id="results"></div></section></div></main><script src="/images.js"></script></body></html>
